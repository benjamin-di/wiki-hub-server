name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - run: uv python install '${{ matrix.python }}'
      - run: git lfs version
      - run: make check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - run: uv sync --locked --python 3.12
      - run: git lfs version
      - run: uv run --locked playwright install --with-deps chromium
      - run: make check-browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-hub-browser-checks
          path: .artifacts/
          if-no-files-found: ignore
          retention-days: 7
  windows-credentials:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - run: >-
          uv run --locked --python 3.13 pytest tests/test_windows_credentials.py tests/test_credentials.py
          tests/test_git_auth.py tests/test_cli.py tests/test_copy_lock.py
          tests/test_credential_lock.py
