# Samba configuration for the Wiki drive. Bind the application's drive views at
# /shares/views, the control directory at /drive-control and the agent's report
# directory. Restrict network access to your LAN or private route.
[global]
    server role = standalone server
    security = user
    map to guest = Never
    server min protocol = SMB3_11
    server smb encrypt = required
    smb ports = 445
    disable netbios = yes
    load printers = no
    disable spoolss = yes
    printing = bsd
    printcap name = /dev/null
    passdb backend = tdbsam
    guest ok = no
    nt acl support = no
    store dos attributes = no
    map readonly = permissions
    csc policy = disable
    wide links = no

[wikis]
    comment = Wiki
    # Bind WIKI_DRIVE_DIR/views read-write at /shares/views. %G is the device's
    # primary group, its person, so each device opens only its person's view.
    # The files decide what may change: pages for writers, nothing else.
    path = /shares/views/%G
    # Device accounts only; set per share, since a global list also blocks the
    # IPC$ access Explorer needs to browse.
    valid users = @wikidrive
    read only = no
    inherit acls = yes
    create mask = 0660
    directory mask = 0770
    follow symlinks = no
    hide files = /desktop.ini/

# Optional: only with WIKI_DRIVE_INBOX_SHARE=inbox. Bind the application's
# drive/inbox at /shares/inbox read-write, separately from the views.
# %G is the authenticated device's primary group (its person group).
[inbox]
    comment = Wiki Inbox
    path = /shares/inbox/%G
    valid users = @wikidrive
    read only = no
    inherit acls = yes
    create mask = 0660
    directory mask = 0770
    follow symlinks = no
    veto files = /desktop.ini/autorun.inf/*.lnk/*.url/*.scf/
